services:
  postgres:
    image: postgres:16-alpine
    container_name: intellibus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: intellibus
      POSTGRES_USER: intellibus
      POSTGRES_PASSWORD: intellibus
    ports:
      - "5432:5432"
    volumes:
      - intellibus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellibus -d intellibus"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  intellibus_pgdata:
